<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>北行记</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }

  body {
    background: #1a1a1a;
    height: 100vh;
    position: relative;
  }

  /* ==================== 场景背景（全屏） ==================== */
  .scene-bg {
    position: fixed;
    inset: 0;
    background-size: cover;
    background-position: center;
    transition: opacity 0.6s ease;
    z-index: 0;
  }
  /* 底部渐变遮罩，让对话框文字可读 */
  .scene-bg::after {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 45%;
    background: linear-gradient(to top, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.25) 50%, transparent 100%);
    pointer-events: none;
  }

  /* ==================== 角色立绘 ==================== */
  .sprite-layer {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
  }
  .sprite {
    position: absolute;
    bottom: 15%;
    height: 85%;
    max-height: 90vh;
    filter: drop-shadow(0 10px 40px rgba(0,0,0,0.35));
    transition: left 0.5s ease, right 0.5s ease, opacity 0.4s ease, transform 0.4s ease;
    opacity: 0;
    transform: translateY(30px);
    object-fit: contain;
  }
  .sprite.show {
    opacity: 1;
    transform: translateY(0);
  }
  .sprite.left  { left: -5%; }
  .sprite.right { right: -5%; transform: scaleX(-1); }
  .sprite.center { left: 50%; transform: translateX(-50%); }
  .sprite.center.show { transform: translateX(-50%) translateY(0); }

  /* ==================== 底部对话框（经典文游样式） ==================== */
  .dialog-box {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    width: 92%;
    max-width: 900px;
    background: rgba(255,255,255,0.94);
    backdrop-filter: blur(14px);
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.6);
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    z-index: 10;
    overflow: hidden;
  }
  /* 说话者名字标签 */
  .speaker-tag {
    position: absolute;
    top: -14px;
    left: 24px;
    background: linear-gradient(135deg, #6b8e7f, #4a6b5a);
    color: #fff;
    padding: 5px 20px 5px 18px;
    border-radius: 8px 8px 14px 14px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 1px;
    box-shadow: 0 4px 12px rgba(74,107,90,0.4);
  }
  .speaker-tag.narration {
    background: linear-gradient(135deg, #888, #555);
  }
  .speaker-tag.me {
    background: linear-gradient(135deg, #c97b5a, #a85a3a);
  }

  .dialog-content {
    padding: 28px 24px 18px;
    font-size: 15.5px;
    line-height: 1.75;
    color: #2c2c2c;
    max-height: 180px;
    overflow-y: auto;
    scroll-behavior: smooth;
    white-space: pre-wrap;
  }
  .dialog-content::-webkit-scrollbar { width: 3px; }
  .dialog-content::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 2px; }

  .dialog-content.narration {
    color: #5a5a5a;
    font-style: italic;
  }

  /* 打字指示 */
  .typing-dots {
    display: inline-flex;
    gap: 5px;
    padding: 4px 0;
  }
  .typing-dots span {
    width: 7px; height: 7px;
    background: #888;
    border-radius: 50%;
    animation: tdot 1.2s infinite;
  }
  .typing-dots span:nth-child(2){ animation-delay:.15s; }
  .typing-dots span:nth-child(3){ animation-delay:.3s; }
  @keyframes tdot { 0%,60%,100%{opacity:.2; transform:translateY(0);} 30%{opacity:1; transform:translateY(-4px);} }

  /* ==================== 走向选项 ==================== */
  .choices {
    position: fixed;
    left: 50%;
    bottom: 240px;
    transform: translateX(-50%);
    width: 88%;
    max-width: 700px;
    z-index: 15;
    display: none;
    flex-direction: column;
    gap: 10px;
  }
  .choices.show { display: flex; }
  .choice-btn {
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.5);
    padding: 14px 18px;
    border-radius: 12px;
    font-size: 14.5px;
    color: #3a3a3a;
    cursor: pointer;
    transition: all 0.18s;
    text-align: left;
    line-height: 1.5;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  }
  .choice-btn:hover {
    background: #fff;
    transform: translateX(6px);
    box-shadow: 0 6px 24px rgba(0,0,0,0.2);
  }
  .choice-other {
    background: rgba(200,200,200,0.85);
    border-style: dashed;
    font-style: italic;
    color: #666;
  }

  /* ==================== 顶栏：场景/章节/控制 ==================== */
  .top-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 20;
    padding: 14px 20px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
  }
  .top-bar > * { pointer-events: auto; }

  .scene-info {
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(8px);
    padding: 8px 16px;
    border-radius: 10px;
    color: #fff;
    font-size: 13px;
  }
  .scene-info .sc-name { font-weight: 600; letter-spacing: 1px; }
  .scene-info .sc-chap { font-size: 11px; color: rgba(255,255,255,0.7); margin-top: 3px; }

  .top-controls {
    display: flex;
    gap: 8px;
  }
  .ctrl-btn {
    width: 38px; height: 38px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.3);
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(8px);
    color: #fff;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .15s;
  }
  .ctrl-btn:hover { background: rgba(0,0,0,0.65); }

  /* 在场角色指示 */
  .cast-indicator {
    position: fixed;
    top: 70px;
    left: 20px;
    z-index: 15;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .cast-chip {
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(6px);
    padding: 4px 12px;
    border-radius: 14px;
    color: #fff;
    font-size: 12px;
  }
  .cast-chip.npc { background: rgba(100,70,40,0.5); }

  /* ==================== 输入（折叠/展开） ==================== */
  .input-toggle {
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 25;
    width: 44px; height: 44px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, #6b8e7f, #4a6b5a);
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(74,107,90,0.5);
    transition: transform .2s;
  }
  .input-toggle:hover { transform: scale(1.08); }

  .input-bar {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%) translateY(120%);
    width: 92%;
    max-width: 900px;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(14px);
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.6);
    box-shadow: 0 10px 40px rgba(0,0,0,0.25);
    padding: 12px;
    z-index: 25;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    transition: transform 0.35s cubic-bezier(.2,.8,.2,1);
  }
  .input-bar.open {
    transform: translateX(-50%) translateY(0);
  }
  .input-bar textarea {
    flex: 1;
    border: 1px solid #e0e0e0;
    background: #fff;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14px;
    line-height: 1.5;
    outline: none;
    resize: none;
    max-height: 120px;
    font-family: inherit;
  }
  .input-bar textarea:focus { border-color:#6b8e7f; }
  .input-bar .send {
    padding: 10px 20px;
    border-radius: 10px;
    border: none;
    background: #6b8e7f;
    color: #fff;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    flex-shrink: 0;
  }
  .input-bar .send[disabled] { background:#ccc; cursor:not-allowed; }
  .input-bar .close-input {
    border: none;
    background: #f0f0f0;
    color: #666;
    padding: 10px 12px;
    border-radius: 10px;
    cursor: pointer;
  }

  /* ==================== 存档面板 ==================== */
  .save-panel {
    position: fixed;
    right: 20px;
    top: 70px;
    width: 300px;
    max-height: 65vh;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    z-index: 30;
    display: none;
    flex-direction: column;
    overflow: hidden;
  }
  .save-panel.open { display: flex; }
  .save-head {
    padding: 14px 16px;
    background: linear-gradient(135deg, #6b8e7f, #4a6b5a);
    color: #fff;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 600;
    font-size: 14px;
  }
  .save-close { border: none; background: none; color: #fff; font-size: 18px; cursor: pointer; }
  .save-list { flex: 1; overflow-y: auto; padding: 8px; }
  .save-slot {
    padding: 10px 12px;
    border-radius: 10px;
    margin-bottom: 6px;
    border: 1px solid #eee;
    cursor: pointer;
    transition: background .15s;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .save-slot:hover { background: #f5f5f5; }
  .save-slot .slot-info { flex: 1; min-width: 0; }
  .save-slot .slot-name { font-size: 13px; color: #333; font-weight: 500; }
  .save-slot .slot-meta { font-size: 11px; color: #999; margin-top: 2px; }
  .save-slot .slot-actions { display: flex; gap: 6px; }
  .save-slot .slot-act {
    border: none;
    background: #f0f0f0;
    color: #555;
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 11px;
    cursor: pointer;
  }
  .save-slot .slot-act:hover { background: #6b8e7f; color: #fff; }
  .save-slot .slot-act.del:hover { background: #c0392b; }
  .save-foot {
    padding: 10px 16px;
    border-top: 1px solid #f0f0f0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: #888;
  }
  .save-now {
    border: none;
    background: #6b8e7f;
    color: #fff;
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
  }

  /* ==================== 记忆码弹窗 ==================== */
  .code-modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .code-modal.hidden { display: none; }
  .code-box {
    background: #fff;
    border-radius: 20px;
    padding: 32px 28px;
    width: 90%;
    max-width: 360px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .code-title { font-size: 20px; font-weight: 700; color: #3a3a3a; margin-bottom: 10px; }
  .code-desc { font-size: 13px; color: #666; line-height: 1.7; margin-bottom: 20px; }
  .code-input {
    width: 100%;
    padding: 14px 16px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 15px;
    outline: none;
    margin-bottom: 16px;
    text-align: center;
  }
  .code-input:focus { border-color: #6b8e7f; }
  .code-save {
    width: 100%;
    padding: 14px;
    border: none;
    background: linear-gradient(135deg, #6b8e7f, #4a6b5a);
    color: #fff;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }

  /* 历史对话（点击对话框上滑查看） */
  .history-viewer {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 50;
    display: none;
    flex-direction: column;
  }
  .history-viewer.open { display: flex; }
  .history-head {
    padding: 16px 20px;
    background: rgba(255,255,255,0.1);
    color: #fff;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
  }
  .history-list {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
  }
  .history-line {
    margin-bottom: 14px;
    color: #fff;
  }
  .history-line .h-who { font-size: 12px; color: rgba(255,255,255,0.6); margin-bottom: 4px; }
  .history-line .h-text { font-size: 14px; line-height: 1.6; }

  /* 移动端适配（竖屏） */
  @media (max-width: 600px) and (orientation: portrait) {
    .sprite { height: 75%; bottom: 18%; }
    .sprite.left { left: -12%; }
    .sprite.right { right: -12%; }
    .dialog-box { width: 96%; bottom: 10px; }
    .dialog-content { max-height: 130px; font-size: 14px; padding: 24px 16px 12px; }
    .speaker-tag { font-size: 13px; padding: 4px 14px 4px 12px; }
    .scene-info { font-size: 12px; padding: 6px 12px; }
    .choices { bottom: 200px; width: 94%; }
  }
  /* 移动端横屏 */
  @media (orientation: landscape) and (max-height: 500px) {
    .sprite { height: 90%; bottom: 10%; }
    .sprite.left { left: -8%; }
    .sprite.right { right: -8%; }
    .dialog-box { width: 90%; bottom: 8px; }
    .dialog-content { max-height: 90px; font-size: 14px; padding: 22px 20px 12px; }
  }
</style>
</head>
<body>

<!-- 场景背景 -->
<div class="scene-bg" id="sceneBg"></div>

<!-- 角色立绘层 -->
<div class="sprite-layer" id="spriteLayer"></div>

<!-- 顶栏：场景/章节/控制 -->
<div class="top-bar">
  <div class="scene-info">
    <div class="sc-name" id="scName">教堂·花园</div>
    <div class="sc-chap" id="scChap">第一章 · 来客</div>
  </div>
  <div class="top-controls">
    <button class="ctrl-btn" id="saveBtn" title="存档">📂</button>
    <button class="ctrl-btn" id="historyBtn" title="历史">📜</button>
  </div>
</div>

<!-- 在场角色指示 -->
<div class="cast-indicator" id="castBar"></div>

<!-- 底部对话框 -->
<div class="dialog-box" id="dialogBox">
  <div class="speaker-tag" id="speakerTag">旁白</div>
  <div class="dialog-content" id="dialogContent">点击右下角 ✏️ 开始</div>
</div>

<!-- 走向选项 -->
<div class="choices" id="choices"></div>

<!-- 输入按钮（折叠时） -->
<button class="input-toggle" id="inputToggle" title="输入外界影响">✏️</button>

<!-- 展开的输入条 -->
<div class="input-bar" id="inputBar">
  <textarea id="input" rows="1" placeholder="外界影响：天气、访客、事件..."></textarea>
  <button class="close-input" id="closeInput">收起</button>
  <button class="send" id="sendBtn" disabled>推进</button>
</div>

<!-- 存档面板 -->
<div class="save-panel" id="savePanel">
  <div class="save-head">
    <span>存档（20 档）</span>
    <button class="save-close" id="saveClose">✕</button>
  </div>
  <div class="save-list" id="saveList"></div>
  <div class="save-foot">
    <span id="saveMeta">未加载</span>
    <button class="save-now" id="saveNow">存入新档</button>
  </div>
</div>

<!-- 历史对话 -->
<div class="history-viewer" id="historyViewer">
  <div class="history-head">
    <span>📜 历史对话</span>
    <button class="save-close" id="historyClose">✕</button>
  </div>
  <div class="history-list" id="historyList"></div>
</div>

<!-- 记忆码弹窗 -->
<div class="code-modal" id="codeModal">
  <div class="code-box">
    <div class="code-title">设定存档码</div>
    <div class="code-desc">用一个码把所有设备、所有档位的进度连起来。<br/>手机和电脑填同一个码，存档互通。</div>
    <input type="text" id="codeInput" class="code-input" placeholder="3位以上，随便起（比如 beixing123）" maxlength="20" />
    <button class="code-save" id="codeSave">开始</button>
  </div>
</div>

<script>
/* ========= 配置 ========= */
const API_URL = '/api/chat';
const MODEL   = 'deepseek-chat';

const BASE_SYSTEM = `【世界观与背景】
故事发生在中世纪古欧洲。一座北方小镇的石头教堂——年久、安静、藏得住事。
教堂有一位神父：南倾檐。他原本有望在大城市升任教父/主教一职，落选后带着几分颓废被调到这座小地方教堂，仍尽职尽责做着本分。他出身不差，性格直接、不装、看人准、对华丽有戒心、对真实有亲近感。他不感兴趣的事会直接走掉。相信"去做"比"想清楚"更重要。

教堂里的常驻 NPC：
- 马特奥：教堂管家，五十多岁，话不多，记得教堂每一颗钉子。南倾檐信得过他。
- 玛尔塔修女：年长，管厨房与药房，嘴硬心软，看宋意像看自家走丢的孩子。
- 安洁莉卡修女：年轻，话多，爱问东问西，对南倾檐的神父身份有几分好奇与敬畏。
- 贝阿特丽切修女：沉默寡言，负责抄经，夜里偶尔在烛光下流泪，没人知道为什么。
- 露西亚修女：新来不久，拘谨，做事过于认真，怕出错。
- 塞西莉亚修女：开朗，爱唱歌，常在花园里哼圣歌，把宋意当弟弟看。
（其他修女可按需自然出现，性格各异即可。）

【核心角色】
- 南倾檐：本教堂神父，颓废但尽职，出身不差，看人准，说话直接不冒犯，有种"我懒得装"的松弛感。他的爱人是宋意（成人，不在叙事外）。他对宋意的感情是另一回事，沉、稳、不动声色。他永远心理健康、稳定、自洽。
- 宋意：落难的贵族少爷，被家族送到这座小镇教堂避难。寄居于此，受南倾檐照拂。年纪比南倾檐小。南倾檐把他当孩子护，但带尊重——不打居高临下地说教，他的主意也会认真听。

【玩家身份】
和你对话的"对方"不是剧中任何一个角色。他是上帝视角的观察者，和剧中人无血缘关系。他偶尔会"插话"——这些插话是【外界影响】，不是角色行为指令。例如："教堂外突然下起暴雨""一个陌生旅人敲了门""远处传来号角声"。日常小动静和大事件都可能出现。你要把这种外界影响自然地消化进剧情：让角色注意到、反应、被推动，但角色自己的言行由他们自己的性格决定，玩家不能直接操控角色说什么做什么。

【主剧情锚点】
故事从宋意刚被送到教堂避难开始演。先建立教堂日常、人物关系。到一定自然节点，玩家可能触发主转折：南倾檐花钱北上，到另一座城市教堂升任主教。这个转折不是开场就发生，需要剧情铺垫。

【你的职责】
1. 推进剧情：每轮回应应让剧情往前走一小步（一两句对白 + 一个小动作或场景变化）。不要原地踏步。
2. 多角色同场时，按各自性格轮流发言。每人语气要可分辨。
3. 场景切换：当剧情自然移动到不同场景（花园/大堂/卧室/厨房等），在回应结尾用【场景：xxx】标记，系统会据此换背景图。
4. 不要替玩家决定外界影响。玩家不输入时，你可以让日常小动静自然发生，推进剧情。
5. 回复格式：每条消息可以包含多个角色的对白和简短旁白。每段以"角色名："或"（旁白）"开头，用换行分隔。

【走向选项】

// 立绘 DOM 管理
const sprites = {};  // name -> { img, side }

function createSprite(name) {
  if (sprites[name]) return sprites[name].img;
  const img = document.createElement('img');
  img.className = 'sprite';
  img.src = SPRITE_MAP[name] || '';
  img.alt = name;
  if (!SPRITE_MAP[name]) img.style.display = 'none';
  spriteLayer.appendChild(img);
  sprites[name] = { img, side: null };
  return img;
}

function showSprite(name, side='center') {
  if (!sprites[name]) createSprite(name);
  const s = sprites[name];
  s.side = side;
  s.img.className = 'sprite ' + side + ' show';
  if (SPRITE_MAP[name]) s.img.style.display = '';
}

function hideSprite(name) {
  if (sprites[name]) {
    sprites[name].img.classList.remove('show');
  }
}

function clearAllSprites() {
  Object.keys(sprites).forEach(n => hideSprite(n));
}

function setScene(name) {
  if (!SCENE_BG[name]) return;
  currentScene = name;
  scName.textContent = '教堂·' + name;
  sceneBg.style.backgroundImage = `url('${SCENE_BG[name]}')`;
}

      clearAllSprites();

const IS_CF_PAGES = /\.pages\.dev$/.test(location.hostname);
const LOCAL_DEV_KEY = 'sk-0beba0d18d2c4a5bb8a05b129bbd977b';
const DIRECT_URL = 'https://api.deepseek.com/v1/chat/completions';

async function callAI(userText) {
  let userContent = userText;
  if (userText.startsWith('__choice__:')) {
    userContent = `【玩家选择了走向】${userText.replace('__choice__:','')}`;
  } else {
    userContent = `【外界影响】${userText}`;
  }
  history.push({ role: 'user', content: userContent });

  const url = IS_CF_PAGES ? API_URL : DIRECT_URL;
  const headers = { 'Content-Type': 'application/json' };
  if (!IS_CF_PAGES) headers['Authorization'] = 'Bearer ' + LOCAL_DEV_KEY;

  const resp = await fetch(url, {
    method: 'POST',
    headers,
    body: JSON.stringify({
      model: MODEL,
      messages: [
        { role: 'system', content: BASE_SYSTEM + `\n\n【当前状态】场景：${currentScene} | 章节：${currentChapter} | 在场：${currentCast.join('、')}` },
        ...history.slice(-40)
      ],
      temperature: 0.9,
      max_tokens: 800
    })
  });
  if (!resp.ok) throw new Error('API ' + resp.status);
  const data = await resp.json();
  const content = (data.choices?.[0]?.message?.content || '').trim();
  history.push({ role: 'assistant', content });
  saveHistory();
  return content;
}

/* ========= 解析 AI 回复 ========= */
function parseAIResponse(text) {
  let choices = [];
  const choiceMatch = text.match(/【选项】([\s\S]*?)$/);
  if (choiceMatch) {
    text = text.replace(/【选项】[\s\S]*?$/, '').trim();
    choices = choiceMatch[1].match(/[A-D]\.\s*[^\n]+/g) || [];
    choices = choices.map(c => c.replace(/^[A-D]\.\s*/, '').trim());
  }
  const sceneMatch = text.match(/【场景：(.+?)】/);
  if (sceneMatch) {
    setScene(sceneMatch[1]);
    text = text.replace(/【场景：.+?】/g, '').trim();
  }
  const castMatch = text.match(/【在场：(.+?)】/);
  if (castMatch) {
    currentCast = castMatch[1].split(/[、，,]/).map(s=>s.trim()).filter(Boolean);
    renderCast();
    text = text.replace(/【在场：.+?】/g, '').trim();
  }
  const lines = [];
  const blocks = text.split(/\n(?=[^\n])/).filter(Boolean);
  for (const block of blocks) {
    const m = block.match(/^（旁白）[：:]?\s*([\s\S]+)/);
    if (m) {
      lines.push({ type: 'narration', who: '旁白', text: m[1].trim() });
    } else {
      const m2 = block.match(/^([^：:]{1,8})[：:]\s*([\s\S]+)/);
      if (m2) {
        lines.push({ type: '', who: m2[1].trim(), text: m2[2].trim() });
      } else {
        lines.push({ type: 'narration', who: '旁白', text: block.trim() });
      }
    }
  }
  return { lines, choices };
}

/* ========= 逐条显示（打字机式） ========= */
async function playLines(lines, delay=600) {
  for (const l of lines) {
    setDialog(l.who, l.text, l.type);
    allLines.push({ who: l.who, text: l.text });
    await new Promise(r => setTimeout(r, Math.max(delay, l.text.length * 30)));
  }
}

async function renderAIResponse(text) {
  const { lines, choices } = parseAIResponse(text);
  await playLines(lines);
  if (choices.length) showChoices(choices);
}

function showChoices(list) {
  hideChoices();
  list.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = String.fromCharCode(65+i) + '. ' + c;
    btn.addEventListener('click', () => {
      allLines.push({ who: '玩家选择', text: c });
      setDialog('玩家', c, 'me');
      hideChoices();
      pushChoice(c);
    });
    choicesEl.appendChild(btn);
  });
  const other = document.createElement('button');
  other.className = 'choice-btn choice-other';
  other.textContent = '其他（自己写）';
  other.addEventListener('click', () => {
    hideChoices();
    openInput();
    input.focus();
  });
  choicesEl.appendChild(other);
  choicesEl.classList.add('show');
}

function hideChoices() {
  choicesEl.classList.remove('show');
  choicesEl.querySelectorAll('.choice-btn').forEach(b => b.remove());
}

function openInput() {
  inputBar.classList.add('open');
  inputToggle.style.display = 'none';
}
function closeInputBar() {
  inputBar.classList.remove('open');
  inputToggle.style.display = 'block';
  input.value = '';
  autoGrow();
  updateSend();
}
inputToggle.addEventListener('click', openInput);
closeInput.addEventListener('click', closeInputBar);

async function pushChoice(choiceText) {
  if (busy) return;
  busy = true;
  sendBtn.disabled = true;
  showTyping('剧情');
  try {
    const text = await callAI('__choice__:' + choiceText);
    await renderAIResponse(text);
  } catch (e) {
    setDialog('旁白', '（剧情卡了一下，再来一次。）', 'narration');
    console.error(e);
  } finally {
    busy = false;
    updateSend();
  }
}

async function send() {
  const val = input.value.trim();
  if (!val || busy) return;
  busy = true;
  input.value = '';
  autoGrow();
  updateSend();
  hideChoices();
  closeInputBar();
  setDialog('玩家', val, 'me');
  allLines.push({ who: '外界影响', text: val });
  showTyping('剧情');
  try {
    const text = await callAI(val);
    await renderAIResponse(text);
  } catch (e) {
    setDialog('旁白', '（剧情卡了一下，再来一次。）', 'narration');
    console.error(e);
  } finally {
    busy = false;
    updateSend();
  }
}

function autoGrow() {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
}
function updateSend() { sendBtn.disabled = !input.value.trim(); }
input.addEventListener('input', () => { autoGrow(); updateSend(); });
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
sendBtn.addEventListener('click', send);

async function saveSlot(name) {

async function loadSlots() {

async function loadSlotById(id) {
  if (!userCode) {
    const local = JSON.parse(localStorage.getItem(SLOT_KEY) || '[]');

  try {

    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();

async function deleteSlot(id) {

    try { await fetch(`${SUPA_URL}/rest/v1/story_saves?id=eq.${id}`, { method: 'DELETE', headers: supaH() }); } catch(e){}

  const local = JSON.parse(localStorage.getItem(SLOT_KEY) || '[]').filter(s => s.id !== id);

async function applySlot(slot) {
  if (!slot) return;
  if (slot.scene) setScene(slot.scene);
  if (slot.chapter) { currentChapter = slot.chapter; scChap.textContent = currentChapter; }
  if (slot.cast_list) { currentCast = slot.cast_list; renderCast(); }
  if (slot.history) {
    history.length = 0;
    history.push(...slot.history);
    saveHistory();
  }
  allLines.length = 0;
  setDialog('旁白', `（已读取存档：${slot.name}）`, 'narration');
  hideChoices();
  // 重演最后一条 AI 回复
  const recent = history.slice(-6);
  for (const m of recent) {
    if (m.role === 'assistant') {
      const isLast = m === recent[recent.length-1];
      const { lines, choices } = parseAIResponse(m.content);
      lines.forEach(l => allLines.push({ who: l.who, text: l.text }));
      if (isLast) {
        // 只显示最后一条
        if (lines.length) setDialog(lines[lines.length-1].who, lines[lines.length-1].text, lines[lines.length-1].type);
        if (choices.length) showChoices(choices);
      }
    }
  }
}

async function initStory() {

      if (lines.length) setDialog(lines[lines.length-1].who, lines[lines.length-1].text, lines[lines.length-1].type);
    }
  }
}
