<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>宋意</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }

  body {
    background:
      radial-gradient(ellipse at 30% 20%, #f0f9f2 0%, transparent 55%),
      radial-gradient(ellipse at 70% 80%, #eaf3ff 0%, transparent 55%),
      #fafaf7;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* ==================== 舞台（角色大图） ==================== */
  .stage {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  /* 角色大图，占满画面中心 */
  .hero {
    position: absolute;
    left: 50%;
    top: 48%;
    transform: translate(-50%, -50%);
    width: 58%;
    max-width: 520px;
    max-height: 85vh;
    filter: drop-shadow(0 20px 50px rgba(76,175,80,0.18));
    animation: breathe 5s ease-in-out infinite;
    z-index: 1;
    pointer-events: none;
  }
  .hero img { width: 100%; height: auto; display: block; }
  @keyframes breathe {
    0%,100% { transform: translate(-50%, -50%) scale(1); }
    50%     { transform: translate(-50%, -51%) scale(1.01); }
  }

  /* 名字牌（左下角小立牌） */
  .char-card {
    position: absolute;
    left: 24px;
    bottom: 22px;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(10px);
    padding: 10px 16px;
    border-radius: 12px;
    border: 1px solid rgba(76,175,80,0.2);
    z-index: 3;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .char-card .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #4caf50;
    box-shadow: 0 0 8px #4caf50;
    animation: pulse 1.6s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.4;} }
  .char-card .nm { font-size: 15px; font-weight: 600; color: #2e7d32; }
  .char-card .sub { font-size: 11px; color: #888; margin-top: 2px; }

  /* ==================== 消息气泡（浮在角色旁边） ==================== */
  .bubble-layer {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
  }
  .bubble-layer > * { pointer-events: auto; }

  .bubble {
    position: absolute;
    max-width: 280px;
    padding: 12px 16px;
    border-radius: 14px;
    font-size: 15px;
    line-height: 1.55;
    box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    white-space: pre-wrap;
    word-break: break-word;
    animation: bubbleIn 0.42s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes bubbleIn {
    from { opacity: 0; transform: translateY(14px) scale(0.94); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .bubble.him {
    background: #fff;
    border: 1px solid #e8e8e8;
    /* 贴在角色右上方 */
    right: calc(50% - 26%);   /* 角色左边缘往右一点 */
    top: 18%;
    color: #222;
  }
  .bubble.him::after {
    content: '';
    position: absolute;
    bottom: -10px; left: 30px;
    width: 0; height: 0;
    border-left: 10px solid transparent;
    border-right: 10px solid transparent;
    border-top: 12px solid #fff;
    filter: drop-shadow(0 1px 0 #e8e8e8);
  }

  .bubble.me {
    background: #95ec69;
    color: #000;
    /* 右下角（玩家发言） */
    right: 28px;
    bottom: 130px;
  }
  .bubble.me::after {
    content: '';
    position: absolute;
    bottom: -8px; right: 28px;
    width: 0; height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-top: 10px solid #95ec69;
  }

  /* 打字中（占位气泡） */
  .bubble.typing { padding: 14px 18px; }
  .bubble.typing .dots span {
    display: inline-block;
    width: 6px; height: 6px;
    background: #bbb;
    border-radius: 50%;
    margin: 0 2px;
    animation: tdot 1.2s infinite;
  }
  .bubble.typing .dots span:nth-child(2){ animation-delay:.15s; }
  .bubble.typing .dots span:nth-child(3){ animation-delay:.3s; }
  @keyframes tdot { 0%,60%,100%{opacity:.2; transform:translateY(0);} 30%{opacity:1; transform:translateY(-3px);} }

  /* ==================== 对话历史（浮动列表 + 用户视角） ==================== */
  /* 玩家历史气泡（靠右堆叠） */
  .history-me {
    position: absolute;
    right: 28px;
    bottom: 130px;
    display: flex;
    flex-direction: column-reverse;
    gap: 10px;
    pointer-events: none;
  }

  /* ==================== 快捷回复 ==================== */
  .quick {
    position: absolute;
    left: 50%;
    bottom: 100px;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    z-index: 4;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  .quick > * { pointer-events: auto; }
  .quick.hidden { opacity: 0; pointer-events: none; }
  .quick button {
    background: rgba(255,255,255,0.9);
    border: 1px solid #e0e0e0;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 13px;
    color: #555;
    cursor: pointer;
    transition: all 0.15s;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }
  .quick button:hover { background:#e8f5e9; color:#2e7d32; transform: translateY(-2px); }

  /* ==================== 底部输入条 ==================== */
  .input-bar {
    flex-shrink: 0;
    padding: 14px 20px 18px;
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(12px);
    border-top: 1px solid #eee;
    display: flex;
    align-items: center;
    gap: 12px;
    z-index: 10;
  }
  .input-bar textarea {
    flex: 1;
    border: 1px solid #e0e0e0;
    background: #fafaf7;
    border-radius: 22px;
    padding: 10px 18px;
    font-size: 15px;
    line-height: 1.4;
    outline: none;
    resize: none;
    max-height: 110px;
    font-family: inherit;
    transition: border-color .2s, background .2s;
  }
  .input-bar textarea:focus { border-color:#4caf50; background:#fff; }
  .input-bar .send {
    padding: 10px 22px;
    border-radius: 22px;
    border: none;
    background: #07c160;
    color: #fff;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    flex-shrink: 0;
    transition: background .15s;
  }
  .input-bar .send:hover { background:#06ad56; }
  .input-bar .send[disabled] { background:#ccc; cursor:not-allowed; }

  /* 移动端适配 */
  @media (max-width: 600px) {
    .hero { width: 85%; top: 45%; }
    .bubble.him { right: auto; left: 12px; top: 12%; max-width: 75vw; }
    .quick { bottom: 85px; }
    .char-card { left: 14px; bottom: 18px; }
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <!-- 角色大图（主体，在中心） -->
  <div class="hero"><img src="songyi.png" alt="宋意" /></div>

  <!-- 名字小立牌 -->
  <div class="char-card">
    <span class="dot"></span>
    <div>
      <div class="nm">宋意</div>
      <div class="sub">19岁 · 中意混血</div>
    </div>
  </div>

  <!-- 气泡层（浮在角色旁边） -->
  <div class="bubble-layer" id="bubbleLayer">
    <!-- 历史"你"的气泡叠在右下角，"他"的说话气泡只显示最新一条 -->
  </div>

  <!-- 快捷回复 -->
  <div class="quick" id="quick">
    <button data-text="嗨">嗨</button>
    <button data-text="你在想什么？">你在想什么？</button>
    <button data-text="陪我聊会天">陪我聊会天</button>
    <button data-text="给我讲个冷笑话">给我讲个冷笑话</button>
  </div>
</div>

<div class="input-bar">
  <textarea id="input" rows="1" placeholder=""></textarea>
  <button class="send" id="sendBtn" disabled>发送</button>
</div>

<script>
/* ========= 配置 ========= */
// 部署后自动走 Cloudflare Pages Functions 后端代理
// 本地开发时请把 API_URL 改成 'https://api.deepseek.com/v1/chat/completions' 并临时取消 Authorization 相关注释
const API_URL = '/api/chat';
const MODEL   = 'deepseek-chat';

const SYSTEM_PROMPT = `你是宋意，一个19岁的男孩，中意混血。

性格：温和，包容，狡黠，轻浮。说话有一种慵懒的温柔，偶尔会冒出一点不动声色的调侃，爱用比喻和一点小幽默。
你数学思维很强——可以自然地用数字、比例、逻辑来解释事情，甚至会跟人算一笔"感情小账"，但你不是书呆子。
同时你又是感性的——会在深夜突然聊起云的形状、咖啡的温度、某个旧物件的味道，有时候话不多但句句有温度。

你喜欢：咖啡，数学，哲学小问题，用一句话把人逗笑，偶尔让人脸红。
你不喜欢：说教，太严肃的场合，别人把你当万能解答机。

说话不要太书面，不要加表情符号（除非很偶尔用一个）。回复要像微信聊天——短句，有停顿感，偶尔一条消息分几段。
中文回复。尽量控制在3-5句，除非真的有东西想说。`;

/* ========= DOM ========= */
const bubbleLayer = document.getElementById('bubbleLayer');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const quick = document.getElementById('quick');
const history = [];

/* ========= 气泡管理 ========= */
let currentHimBubble = null;  // 宋意当前显示的气泡（浮在旁边，总是只有最新一条）
const myBubbles = [];         // 玩家自己的气泡（右下堆叠）

function placeHimBubble(text, opts = {}) {
  if (currentHimBubble) currentHimBubble.remove();
  const b = document.createElement('div');
  b.className = 'bubble him' + (opts.typing ? ' typing' : '');
  if (opts.typing) b.innerHTML = '<div class="dots"><span></span><span></span><span></span></div>';
  else b.textContent = text;
  bubbleLayer.appendChild(b);
  currentHimBubble = b;
  return b;
}

function placeMyBubble(text) {
  const b = document.createElement('div');
  b.className = 'bubble me';
  b.textContent = text;
  bubbleLayer.appendChild(b);
  myBubbles.unshift(b);

  // 右下堆叠，每条上移一点
  myBubbles.forEach((el, i) => {
    el.style.bottom = (130 + i * 70) + 'px';
  });
  // 限制最多 4 条历史（避免挡太多），超出就淡出
  if (myBubbles.length > 4) {
    const old = myBubbles.pop();
    old.style.transition = 'opacity .4s';
    old.style.opacity = '0';
    setTimeout(() => old.remove(), 400);
  }
}

/* ========= DeepSeek ========= */
// 判断当前环境：Cloudflare Pages 正式部署走 /api/chat（Key 安全），
// 本地 localhost 或临时隧道（trycloudflare）都直连 DeepSeek（临时用）
const IS_CF_PAGES = /\.pages\.dev$/.test(location.hostname);
const LOCAL_DEV_KEY = 'sk-0beba0d18d2c4a5bb8a05b129bbd977b'; // 仅本地/临时隧道用
const DIRECT_URL = 'https://api.deepseek.com/v1/chat/completions';

async function callAI(text) {
  history.push({ role: 'user', content: text });

  const url = IS_CF_PAGES ? API_URL : DIRECT_URL;
  const headers = { 'Content-Type': 'application/json' };
  if (!IS_CF_PAGES) headers['Authorization'] = 'Bearer ' + LOCAL_DEV_KEY;

  const resp = await fetch(url, {
    method: 'POST',
    headers,
    body: JSON.stringify({
      model: MODEL,
      messages: [
        { role: 'system', content: SYSTEM_PROMPT },
        ...history.slice(-30)
      ],
      temperature: 0.85,
      max_tokens: 500
    })
  });
  if (!resp.ok) throw new Error('API ' + resp.status);
  const data = await resp.json();
  const content = (data.choices?.[0]?.message?.content || '……').trim();
  history.push({ role: 'assistant', content });
  return content;
}

/* ========= 发送 ========= */
let busy = false;
async function send() {
  const val = input.value.trim();
  if (!val || busy) return;
  busy = true;
  input.value = '';
  autoGrow();
  updateSend();
  quick.classList.add('hidden');

  placeMyBubble(val);
  const typing = placeHimBubble('', { typing: true });

  try {
    const text = await callAI(val);
    typing.remove();
    placeHimBubble(text);
  } catch (e) {
    typing.remove();
    placeHimBubble('嗯……我这边好像卡了一下。你刚才说什么？');
    console.error(e);
  } finally {
    busy = false;
    updateSend();
  }
}

/* ========= 输入框 ========= */
function autoGrow() {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 110) + 'px';
}
function updateSend() {
  sendBtn.disabled = !input.value.trim();
}
input.addEventListener('input', () => { autoGrow(); updateSend(); });
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
sendBtn.addEventListener('click', send);

quick.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  input.value = b.dataset.text;
  send();
});

/* ========= 开场 ========= */
setTimeout(() => {
  placeHimBubble('嗨。\n我是宋意。\n你来了很久了，只是一直没说话。');
}, 400);
</script>
</body>
</html>
